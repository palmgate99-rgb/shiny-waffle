name: Update dashboard data

# Fetches real candles and strategy readings every 15 minutes and publishes
# dashboard_data.json on the dashboard-data branch, which the dashboard reads.
# GitHub only runs scheduled workflows from the default branch, and may delay them.

on:
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["fx_strategy/**", ".github/workflows/update-dashboard-data.yml"]

permissions:
  contents: write

concurrency:
  group: dashboard-data
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fx_strategy/requirements.txt
      - run: pip install -r fx_strategy/requirements.txt
      - name: Reuse the last published file (keeps daily FRED data and any market Yahoo skips)
        run: |
          mkdir -p out
          if git fetch --depth 1 origin dashboard-data 2>/dev/null; then
            git show FETCH_HEAD:dashboard_data.json > out/dashboard_data.json || rm -f out/dashboard_data.json
          else
            cp dashboard_data.json out/dashboard_data.json
          fi
      - run: python -m fx_strategy.export_dashboard --out out/dashboard_data.json
      - name: Publish to the dashboard-data branch
        run: |
          cd out
          git init -q -b dashboard-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard_data.json
          git commit -q -m "Update dashboard data"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dashboard-data
