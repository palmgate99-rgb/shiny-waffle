name: Dashboard validation (public feed publishing disabled)

# No scheduled/export/publication job: provider redistribution rights are unverified.
# Keep data private. This workflow only runs deterministic tests.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r fx_strategy/requirements.txt
      - run: python -m unittest fx_strategy.tests.test_strategy
      - run: node tests/dashboard.test.cjs
      - run: node tests/feed.test.cjs
